# experiments/baseline_config.yaml
# Baseline MLP configuration for Sketch-to-Face synthesis
# Run: python src/training/train.py --config experiments/baseline_config.yaml

seed: 42
run_name: baseline_mlp_v1
log_dir: experiments/logs
checkpoint_dir: checkpoints

# Data paths (generated by preprocessing pipeline)
train_edges:  data/processed/train/edges
train_photos: data/processed/train/photos
val_edges:    data/processed/val/edges
val_photos:   data/processed/val/photos
test_edges:   data/processed/test/edges
test_photos:  data/processed/test/photos

# Image size for MLP (smaller than pSp to keep dims manageable)
img_size: 64

# Training
num_epochs: 50
batch_size: 64
lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
early_stopping_patience: 10

# Model architecture
model:
  hidden_dims: [2048, 1024, 512]
  dropout_rate: 0.3
  leaky_alpha: 0.2
